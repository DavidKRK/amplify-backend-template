version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Temporary (issue #98): Dependabot security updates remain blocked by
      # upstream Amplify transitive constraints (csv-parse and
      # @opentelemetry/core). Remove these ignores once an upstream-compatible
      # Amplify upgrade path exists or the vulnerability disappears from audit.
      - dependency-name: "csv-parse"
      - dependency-name: "@opentelemetry/core"
